# Database — defaults match the docker run command in the README, so a local
# checkout boots without exporting anything. Railway supplies real values.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/purchasedecision}
spring.datasource.username=${DB_USERNAME:vaishnavi}
spring.datasource.password=${DB_PASSWORD:password123}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# App
server.port=${PORT:8080}

# Railway (and any reverse proxy) terminates TLS and forwards X-Forwarded-*.
# Without this, springdoc advertises an http:// server URL while Swagger UI is
# served over https://, and the browser blocks every "Try it out" call as mixed
# content. This is what makes "Execute" work on the deployed docs.
server.forward-headers-strategy=framework

# Dev-only fallback secret. MUST be overridden with JWT_SECRET in production.
jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-in-production-32b}
jwt.expiration=86400000

# Optional. Without a key the decision endpoint falls back to the rule-based
# explanation instead of failing, so Swagger stays testable with no OpenAI key.
openai.api.key=${OPENAI_API_KEY:}
openai.api.url=https://api.openai.com/v1/chat/completions

# Seeds a shared demo account on boot and exposes POST /api/auth/demo, so anyone
# handed the Swagger link can get a verdict without signing up. Set to false to
# remove both the account and the endpoint.
app.demo.enabled=${DEMO_ENABLED:true}

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Keeps the Bearer token you pasted into "Authorize" across page reloads.
springdoc.swagger-ui.persistAuthorization=true
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=method
# Collapse the schema dump at the bottom; the request/response examples are
# what a tester actually needs.
springdoc.swagger-ui.defaultModelsExpandDepth=1
springdoc.writer-with-order-by-keys=true
